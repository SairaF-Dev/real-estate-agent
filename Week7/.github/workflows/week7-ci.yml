name: Week 7 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [day2, day3, day4, day5, day7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.module }}/requirements.txt
      - name: Install dependencies
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          if [ "${{ matrix.module }}" = "day7" ]; then
            python -m pip install -r vapi_integration/requirements.txt -r ../day3/requirements.txt
          else
            python -m pip install -r requirements.txt
          fi
      - name: Run tests
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          if [ "${{ matrix.module }}" = "day7" ]; then
            python -m pytest vapi_integration/tests -q
          else
            python -m pytest -q
          fi

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password
          VAPI_WEBHOOK_SECRET: ci-only-webhook-secret
          N8N_ENCRYPTION_KEY: ci-only-encryption-key
        run: docker compose config --quiet
